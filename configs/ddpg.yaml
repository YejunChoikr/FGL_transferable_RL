ddpg:
  actor_lr: 0.0001
  critic_lr: 0.001
  weight_decay: 0.0
  ou: {mu: 0.0, theta: 0.15, sigma: 0.3}

train:
  gamma: 0.99
  tau: 0.001
  batch_size: 64
  memory_capacity: 100000
  episodes: 1500
  episode_length: 30
  memory_fill_episodes: 20
  updates_per_transition: 1
  deterministic_eval_interval: 25

seeds: [0, 1, 2, 3, 4]

transfer:
  layers: [fc1, fc2, fc3, fc4]
  networks: [actor, critic]
  n_tensors: 16
  freeze: false
  transfer_target_networks: false

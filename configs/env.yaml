# Environment, design domains and the assets each domain uses.

env:
  case: raster                # row-wise, left to right within each row
  model_row: 10
  model_col: 3
  state_dim: 60
  critic_input_dim: 61
  action_dim: 1
  action_range: [-1.0, 1.0]
  steps_per_design: 30
  leakyrelu_para: 0.005

grid:
  rows: 10
  cols: 3
  n_independent: 30
  n_full: 60

compression_ratio: 0.15

assets:
  source_surrogate: models/surrogate_source.pth
  source_scaler: models/scaler_source.json
  upper_surrogate: models/surrogate_upper.pth
  upper_scaler: models/scaler_upper.json
  lower_surrogate: models/surrogate_lower.pth
  lower_scaler: models/scaler_lower.json
  ar08_surrogate: models/surrogate_ar08.pth
  ar08_scaler: models/scaler_ar08.json

domains:
  source:
    surrogate: source_surrogate
    scaler: source_scaler
    t_min: 1.2
    t_max: 1.8
    cell_mm: [10.0, 10.0]
    data: data/source_1.2_1.8.json
  upper:
    surrogate: upper_surrogate
    scaler: upper_scaler
    t_min: 1.2
    t_max: 2.4
    cell_mm: [10.0, 10.0]
    data: data/upper_1.2_2.4.json
  lower:
    surrogate: lower_surrogate
    scaler: lower_scaler
    t_min: 0.9
    t_max: 1.8
    cell_mm: [10.0, 10.0]
    data: data/lower_0.9_1.8.json
  ar08:
    surrogate: ar08_surrogate
    scaler: ar08_scaler
    t_min: 1.2
    t_max: 1.8
    cell_mm: [8.0, 10.0]
    data: data/ar08_1.2_1.8.json

tasks:
  FGL5: {target_index0: 4, neighbor_index0: [3, 5]}
  FGL6: {target_index0: 5, neighbor_index0: [4, 6]}
  FGL7: {target_index0: 6, neighbor_index0: [5, 7]}

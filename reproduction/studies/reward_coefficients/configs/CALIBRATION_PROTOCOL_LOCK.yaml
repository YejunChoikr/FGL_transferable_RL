status: LOCKED
selected_config: H1
selection_meaning: SAC literature optimizer setting (Haarnoja et al., SAC Algorithms
  and Applications, Appendix D)
state_schema:
  encoding: surrogate_interleaved_thickness_location
  state_dim: 60
  critic_input_dim: 61
  layout: 30 cells x [normalized_thickness_action, normalized_location], interleaved
  construction: all_state = np.stack((thickness_state, np.broadcast_to(location_state,
    thickness_state.shape)), axis=2).reshape(-1).astype(np.float32)
  one_hot_used: false
  surrogate_input_identical_to_observation: true
  model_row: 10
  model_col: 3
  cell_visit_order: zigzag
network:
  actor:
    input_dim: 60
    hidden:
    - 4096
    - 2048
    - 1024
    - 512
    activation: ReLU
    heads:
    - mu_head
    - log_std_head
    log_std_min: -20.0
    log_std_max: 2.0
    action_squash: tanh
  critics:
    count: 2
    input_dim: 61
    hidden:
    - 4096
    - 2048
    - 1024
    - 512
    activation: ReLU
    output_dim: 1
reward:
  name: original_average_contrast
  numerator: u_i - 0.5*(u_(i-1) + u_(i+1))
  density_code: mean((action + 2)/2) = 0.5 + rho_A
  reward: numerator / density_code
  clipping_or_penalty_or_scaling: none
  task_indices_0based:
    FGL5:
      target: 4
      neighbors:
      - 3
      - 5
    FGL6:
      target: 5
      neighbors:
      - 4
      - 6
    FGL7:
      target: 6
      neighbors:
      - 5
      - 7
sac_and_train_parameters:
  batch_size: 256
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  tau: 0.005
  gamma: 0.99
  episodes: 1500
  episode_length: 30
  memory_fill_episodes: 20
  replay_capacity: 100000
  updates_per_transition: 1
  automatic_entropy_tuning: true
  initial_alpha: 0.2
  target_entropy: -1.0
  weight_decay: 0.0
  reward_scale: 1.0
  log_std_min: -20.0
  log_std_max: 2.0
  domain: source_1.2_to_1.8_mm
  memory_fill_policy: current stochastic policy, no gradient updates
  exploration: SAC squashed-Gaussian only (no OU noise, no extra Gaussian noise)
  determinism: cudnn.deterministic=true, cudnn.benchmark=false, TF32 disabled for
    cudnn and matmul, float32_matmul_precision=highest
  seeds_used_in_calibration:
  - 90
  - 91
  - 92
selection_evidence:

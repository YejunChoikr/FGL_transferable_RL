scope_and_limits:
- Locks the SAC optimizer setting on the SOURCE domain (1.2-1.8 mm) only.
- No claim that SAC is algorithmically superior to the historical DDPG; state representation
  and implementation protocol differ.
- Target-domain and transfer-learning experiments are NOT started by this lock.
- Frozen AFTER all 27 runs completed, by the pre-registered rules only. Do not add
  other learning rates, tau or batch sizes after seeing results.
